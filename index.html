<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tip calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="calculator">
        <div class="main-input">
        <div>
            <p class="txts">Bills</p>
            <input type="text " class="bill" placeholder="0"/>
            <span class="dollar">$</span>
          

        </div>

        <div>
        <p class="txts">Select  Tip  %</p>
        
            <div class="input">

        <div class="firstset">
        <button class="tab btn1">5%</button>

        <button class="tab btn2">10%</button>

        <button class="tab btn3">15%</button>
        
    </div>

        <div class="secondset">
        <button class="tab btn4">25%</button>

        <button class="tab btn5">50%</button>

        <input type="text" class="alt" placeholder="CUSTOM">
            </div>

            </div>

        </div>

        <div>
            <p class="txts">Number of people</p>

            <input type="text"placeholder="👤" class="people">
        </div>


        </div>

        <div class="display">
        
            <div class="display-tip">
                <div class="display-pro">
                <div>
                <p class="tip">Tip amount</p>
                <p class="txts"> / Person</p>
                </div>
                <div>
                <h1 class="result1">$0.00</h1>
                </div>
                </div>

                <div class="display-pro2">

                    <div>
                        <p class="tip">Total</p>
                        <p class="txts">/ Person</p>
                    </div>
                    <div>
                        <h1 class="result2">$0.00</h1>
                        
                    </div>
                    
                </div>

            </div>
        

            <div class="btn-border">
                <button class="reset">Reset</button>
            </div>


        </div>



    </div>
  
       
    <script src="app.js"></script>
</body>
</html>
